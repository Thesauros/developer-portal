# Include inside nginx's http block. Next.js must listen on 127.0.0.1:18880.
# This serves the app only; add the marketing/docs locations for a combined site.
server {
    listen 127.0.0.1:8879;
    server_name localhost;
    client_max_body_size 2m;

    proxy_set_header Host localhost:8879;
    proxy_set_header X-Forwarded-Host localhost:8879;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    add_header Cache-Control "private, no-store" always;

    location = /app { proxy_pass http://127.0.0.1:18880/developers/customer; }
    location = /app/ { proxy_pass http://127.0.0.1:18880/developers/customer; }
    location /app/ { proxy_pass http://127.0.0.1:18880/developers/customer/; }

    location = /developers { proxy_pass http://127.0.0.1:18880; }
    location /developers/ { proxy_pass http://127.0.0.1:18880; }

    location = /monitoring { proxy_pass http://127.0.0.1:18880/developers/monitoring; }
    location = /monitoring/ { proxy_pass http://127.0.0.1:18880/developers/monitoring; }
    location /monitoring/ { proxy_pass http://127.0.0.1:18880/developers/monitoring/; }

    location / { return 404; }
}
