name: Account app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BASE_PATH: /developers
      BETTER_AUTH_URL: http://localhost:8879
      BETTER_AUTH_SECRET: ci-only-isolated-test-database-not-for-deployment
      THESAUROS_AUTH_DB: /tmp/thesauros-web-ci/accounts.sqlite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - name: Initialize isolated account database
        run: node scripts/init-auth.mjs
      - run: npm run build
